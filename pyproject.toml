[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigf"
version = "2.4.1"
description = "Bi-directional macromolecular diffraction MTZ/mmCIF simulator (F0 -> F, SIGF) and blind inverse experimental parameter solver (F, SIGF -> beamline, crystal, mount, & processing forensics)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "James M. Holton", email = "JMHolton@lbl.gov" },
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
    "gemmi>=0.6.0",
]
keywords = [
    "crystallography",
    "X-ray diffraction",
    "SIGF",
    "MTZ",
    "mmCIF",
    "nanoBragg",
    "French-Wilson",
    "resolution",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
calibration = ["scipy>=1.8"]

[project.urls]
Repository = "https://github.com/jmholton/SIGF"

[project.scripts]
sim-reso-mtz = "sim_reso_mtz:main"
deduce-mtz-params = "deduce_mtz_params:main"

[tool.setuptools]
py-modules = ["sim_reso_mtz", "deduce_mtz_params"]
